<!DOCTYPE html>
<html>
<head>
<title>Set Password</title>
<style>
body{background:#f6f7fb;font-family:Segoe UI;text-align:center;padding-top:80px}
.card{background:#fff;padding:40px;border-radius:12px;display:inline-block;box-shadow:0 0 25px rgba(0,0,0,.1)}
input,button{width:100%;padding:10px;margin-top:10px}
button{background:#4f46e5;color:white;border:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h2>🔐 Set Your Password</h2>
<form method="post">
<input type="hidden" name="token" value="{{token}}">
<input type="password" name="password" placeholder="Enter New Password" required>
<button type="submit">Set Password</button>
</form>
</div>
</body>
</html>
