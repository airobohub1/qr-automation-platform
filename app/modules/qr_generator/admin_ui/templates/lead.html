<!DOCTYPE html>
<html>
<head>
    <title>AI ROBO HUB - Get Started</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 520px;
            background: #ffffff;
            margin: 70px auto;
            padding: 35px 40px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #2c5364;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-submit {
            background: #28a745;
            color: white;
        }

        .btn-clear {
            background: #ffc107;
            color: #333;
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #ddd;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 AI ROBO HUB</h2>
    <p class="subtitle">{{ plan | upper }} PLAN – Get Started</p>

    <form method="post" action="/api/lead">
        <input name="name" placeholder="Full Name" required>
        <input name="business_name" placeholder="Business Name" required>
        <input name="email" placeholder="Email Address" required>
        <input name="mobile" placeholder="Mobile Number" required>

        <textarea name="business_info" rows="3" placeholder="Business Requirement / Message"></textarea>

        <input type="hidden" name="plan" value="{{ plan }}">
        <input type="hidden" name="source" value="WEB">

        <div class="btn-group">
            <button type="submit" class="btn-submit">📨 Submit</button>
            <button type="reset" class="btn-clear">🔄 Clear</button>
            <button type="button" onclick="window.location='/'" class="btn-cancel">❌ Cancel</button>
        </div>
    </form>
</div>

<footer>
    © 2026 AI ROBO HUB Consulting Services Pvt. Ltd. | All Rights Reserved
</footer>

</body>
</html>
