{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>Reset Password</h2>
{% if error %}<p style="color:red">{{error}}</p>{% endif %}
{% if msg %}<p style="color:green">{{msg}}</p>{% endif %}
<form method="post">
<input name="email" placeholder="Registered Email">
<button>Send Reset Code</button>
</form>
</div>
{% endblock %}
