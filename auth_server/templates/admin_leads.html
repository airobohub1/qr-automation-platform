<!DOCTYPE html>
<html>
<head>
<title>Admin – Leads</title>
<style>
body{font-family:'Segoe UI';background:#f5f7fb;margin:0;}
.header{background:#00c9a7;color:white;padding:15px 30px;font-size:20px;}
.container{padding:30px;}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;}
th{background:#e9fffa;}
.back{margin-bottom:15px;display:inline-block;text-decoration:none;color:#00c9a7;}
</style>
</head>
<body>

<div class="header">📩 Lead Management</div>
<div class="container">

<a class="back" href="/admin">← Back to Admin Home</a>

<table>
<tr>
<th>Name</th><th>Email</th><th>Mobile</th><th>Plan</th><th>Date</th>
</tr>
{% for l in leads %}
<tr>
<td>{{l.name}}</td>
<td>{{l.email}}</td>
<td>{{l.mobile}}</td>
<td>{{l.plan}}</td>
<td>{{l.created_at}}</td>
<td>
<form method="post" action="/admin/convert-lead">
    <input type="hidden" name="lead_id" value="{{l.id}}">
    <select name="plan">
        <option value="paid">PAID</option>
        <option value="enterprise">ENTERPRISE</option>
    </select>
    <button class="btn">Convert</button>
</form>
</td>

</tr>
{% endfor %}
</table>

</div>
</body>
</html>
