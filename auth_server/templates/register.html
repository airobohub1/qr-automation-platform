<!DOCTYPE html>
<html>
<head>
<title>AI ROBO HUB – Create Account – QR Automation Platform</title>
<style>
body{background:#f2f4f8;font-family:Segoe UI,sans-serif;}
.card{width:460px;margin:60px auto;background:#fff;padding:35px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
h2{text-align:center;margin-bottom:20px;}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;}
textarea{resize:none;height:70px;}
button{width:100%;padding:10px;background:#0f62fe;color:#fff;border:none;border-radius:6px;margin-top:12px;}
.error{color:red;text-align:center;}
.links{text-align:center;margin-top:12px;}
small{color:#666;}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post">
<input name="name" value="{{name}}" placeholder="Full Name" required>
<input name="mobile" value="{{mobile}}" placeholder="Mobile Number" required>
<input name="email" value="{{email}}" placeholder="Email Address" required>
<input name="location" value="{{location}}" placeholder="Location" required>
<textarea name="business_info">{{business_info}}</textarea>
<!-- <textarea name="business_info" placeholder="About your Business (Optional)"></textarea> -->
<input type="password" name="password" placeholder="Password" required>
<small>Password must be 8–64 chars with uppercase, lowercase, digit & special char.</small>
<button>CREATE ACCOUNT</button>
</form>
<div class="links">
<a href="/login">Back to Login</a>
</div>
</div>
</body>
</html>
