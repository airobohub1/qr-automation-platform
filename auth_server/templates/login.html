<!DOCTYPE html>
<html>
<head>
<title>AI ROBO HUB – Login - QR Automation Platform</title>
<style>
body {
    background:#f2f4f8;
    font-family:Segoe UI, sans-serif;
}
.card {
    width:420px;
    margin:80px auto;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
h2 {
    text-align:center;
    margin-bottom:25px;
}
input {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
}
button {
    width:100%;
    padding:10px;
    background:#0f62fe;
    color:white;
    border:none;
    border-radius:6px;
    margin-top:15px;
    cursor:pointer;
}
.error {
    color:red;
    text-align:center;
}
.links {
    text-align:center;
    margin-top:12px;
}
</style>
</head>
<body>
<div class="card">
<h2>AI ROBO HUB – Login</h2>
{% if error %}<div class="error">{{error}}</div>{% endif %}
{% if resend %}
<p style="margin-top:10px;">
    Didn’t receive the activation link?  
    <a href="/resend-activation?email={{ email }}" style="color:#4f46e5;">
        Click here to resend
    </a>
</p>
{% endif %}

<form method="post" action="/login">
<input name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button>Login</button>
</form>
<div class="links">
<a href="/register">Create Account </a> |
<a href="/reset"> Forgot Password?</a>
</div>
</div>
</body>
</html>
